[package]
name = "black_hole_rs"
version = "0.1.0"
edition = "2021"
description = "Real-time black hole simulation using wgpu (Schwarzschild geodesics)"

[dependencies]
wgpu = "24"
winit = "0.30"
glam = { version = "0.29", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
env_logger = "0.11"
log = "0.4"
